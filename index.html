<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間割管理アプリ - 自動同期版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .sync-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            font-size: 14px;
        }
        
        .sync-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        .sync-indicator.offline {
            background: #f87171;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            overflow-x: auto;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: #f8f9fa;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s;
            white-space: nowrap;
            min-width: 120px;
        }
        
        .tab:hover {
            background: #e9ecef;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        
        .content {
            padding: 30px;
        }
        
        .view-section {
            display: none;
        }
        
        .view-section.active {
            display: block;
        }
        
        /* 日別表示ナビゲーション */
        .day-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .day-nav button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .day-nav button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .day-nav h2 {
            font-size: 24px;
            color: #333;
        }
        
        /* 共通スタイル */
        .date-selector {
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .date-selector label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #495057;
        }
        
        .date-selector input {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s;
            margin-right: 10px;
        }
        
        .date-selector input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-small {
            padding: 4px 10px;
            font-size: 12px;
        }
        
        /* 日別表示スタイル */
        .schedule-display {
            display: grid;
            gap: 6px;
        }
        
        .schedule-item {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 10px;
            padding: 6px;
            background: #f8f9fa;
            border-radius: 6px;
            transition: all 0.3s;
            align-items: center;
        }
        
        .schedule-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .schedule-right {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .schedule-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .schedule-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        
        .period-badge {
            min-width: 45px;
            padding: 10px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-weight: 600;
            text-align: center;
            font-size: 13px;
        }
        
        .class-badge {
            flex: 1;
            padding: 15px 20px;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            text-align: center;
            font-size: 20px;
        }
        
        .empty-class {
            background: white !important;
            border: 2px solid #e9ecef;
            color: transparent;
        }
        
        .memo-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .memo-controls select {
            flex: 1;
            padding: 6px;
            border: 2px solid #e9ecef;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .memo-right {
            width: 100%;
            padding: 8px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            background: white;
            min-height: 36px;
        }
        
        .memo-right:focus {
            outline: none;
            border-color: #667eea;
        }
        
        /* 週間表示スタイル */
        .week-table-container {
            overflow-x: auto;
        }
        
        .week-table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .week-table th {
            background: #667eea;
            color: white;
            padding: 15px 10px;
            text-align: center;
            font-weight: 600;
        }
        
        .week-table td {
            padding: 12px 10px;
            border: 1px solid #dee2e6;
            text-align: center;
        }
        
        .week-table .period-cell {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }
        
        .week-header {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.9;
        }
        
        /* 基本時間割編集スタイル */
        .edit-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .edit-table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
        }
        
        .edit-table td {
            padding: 8px;
            border: 1px solid #dee2e6;
        }
        
        .edit-table select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .edit-table select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        /* 授業変更編集スタイル */
        .change-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        .change-table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: center;
        }
        
        .change-table td {
            padding: 12px;
            border: 1px solid #dee2e6;
            text-align: center;
        }
        
        .change-table input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        /* 色設定スタイル */
        .color-settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .color-item {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .color-item label {
            font-weight: 600;
            color: #495057;
        }
        
        .color-item input[type="color"] {
            width: 60px;
            height: 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        /* 保存ボタン */
        .save-button {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 30px auto 0;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .save-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .save-button:active {
            transform: translateY(0);
        }
        
        /* メッセージ */
        .message {
            display: none;
            padding: 15px;
            margin-top: 20px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 6px;
            text-align: center;
        }
        
        .message.show {
            display: block;
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 22px;
            }
            
            .content {
                padding: 15px;
            }
            
            .tab {
                font-size: 14px;
                padding: 12px 8px;
                min-width: 100px;
            }
            
            .day-nav {
                flex-direction: column;
                gap: 10px;
            }
            
            .day-nav h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 時間割管理アプリ</h1>
            <p>英語科 | 金子先生用 | 自動同期対応</p>
            <div class="sync-status">
                <div class="sync-indicator" id="syncIndicator"></div>
                <span id="syncStatus">接続中...</span>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('day')">📅 日別表示</button>
            <button class="tab" onclick="switchTab('week')">📊 週別表示</button>
            <button class="tab" onclick="switchTab('base')">⚙️ 基本時間割</button>
            <button class="tab" onclick="switchTab('change')">🔄 授業変更</button>
            <button class="tab" onclick="switchTab('colors')">🎨 色設定</button>
        </div>
        
        <div class="content">
            <!-- 日別表示 -->
            <div id="dayView" class="view-section active">
                <div class="day-nav">
                    <button onclick="previousDay()">← 前日</button>
                    <h2 id="displayDateTitle"></h2>
                    <button onclick="nextDay()">翌日 →</button>
                </div>
                <div class="schedule-display" id="scheduleDisplay"></div>
            </div>
            
            <!-- 週別表示 -->
            <div id="weekView" class="view-section">
                <div class="date-selector">
                    <label for="weekStartDate">週の開始日（月曜日）を選択：</label>
                    <input type="date" id="weekStartDate">
                    <button class="btn btn-primary" onclick="displayWeekSchedule()">表示</button>
                    <button class="btn btn-secondary" onclick="showPreviousWeek()">前週</button>
                    <button class="btn btn-secondary" onclick="showThisWeek()">今週</button>
                    <button class="btn btn-secondary" onclick="showNextWeek()">翌週</button>
                </div>
                <h2 id="weekDisplayTitle" style="margin-bottom: 20px; color: #333;"></h2>
                <div class="week-table-container">
                    <table class="week-table" id="weekScheduleTable"></table>
                </div>
            </div>
            
            <!-- 基本時間割編集 -->
            <div id="baseView" class="view-section">
                <h2 style="margin-bottom: 20px; color: #333;">基本時間割の設定</h2>
                <table class="edit-table" id="baseTimetable">
                    <thead>
                        <tr>
                            <th>時限</th>
                            <th>月曜日</th>
                            <th>火曜日</th>
                            <th>水曜日</th>
                            <th>木曜日</th>
                            <th>金曜日</th>
                        </tr>
                    </thead>
                    <tbody id="baseTimetableBody"></tbody>
                </table>
                <button class="save-button" onclick="saveBaseTimetable()">💾 基本時間割を保存</button>
                <div id="baseMessage" class="message">保存しました！</div>
            </div>
            
            <!-- 授業変更編集 -->
            <div id="changeView" class="view-section">
                <h2 style="margin-bottom: 20px; color: #333;">授業変更の設定</h2>
                <div class="date-selector">
                    <label for="changeDate">変更する日付を選択：</label>
                    <input type="date" id="changeDate">
                    <button class="btn btn-primary" onclick="loadDateTimetable()">読み込み</button>
                </div>
                <div id="selectedDateInfo" style="display: none; margin-bottom: 20px; padding: 15px; background: #e7f3ff; border-radius: 8px;">
                    <h3 style="color: #333;">選択中: <span id="selectedDateText"></span></h3>
                    <p style="color: #6c757d; margin-top: 5px;">変更したい時限のチェックボックスにチェックを入れて、クラスを選択してください</p>
                </div>
                <table class="change-table" id="changeTimetable">
                    <thead>
                        <tr>
                            <th>時限</th>
                            <th>変更</th>
                            <th>クラス</th>
                        </tr>
                    </thead>
                    <tbody id="changeTimetableBody"></tbody>
                </table>
                <button class="save-button" onclick="saveChangeTimetable()">💾 授業変更を保存</button>
                <button class="save-button" style="background: #6c757d; margin-top: 10px;" onclick="clearAllChanges()">🗑️ この日の変更をクリア</button>
                <div id="changeMessage" class="message">保存しました！</div>
            </div>
            
            <!-- 色設定 -->
            <div id="colorsView" class="view-section">
                <h2 style="margin-bottom: 20px; color: #333;">クラス別色設定</h2>
                <div class="color-settings" id="colorSettings"></div>
                <button class="save-button" onclick="saveColors()">💾 色設定を保存</button>
                <div id="colorMessage" class="message">保存しました！</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase設定（埋め込み済み）
        const firebaseConfig = {
            apiKey: "AIzaSyDOqoM1koJVXGmBB-LaTe9MczDm02zO9M",
            authDomain: "time-schedule-49fdc.firebaseapp.com",
            projectId: "time-schedule-49fdc",
            storageBucket: "time-schedule-49fdc.firebasestorage.app",
            messagingSenderId: "1095037674644",
            appId: "1:1095037674644:web:90c0ee33627fa53be40081"
        };
        
        // クラス一覧（基本時間割から自動収集し、空欄のみ固定で先頭に置く）
        const classes = [''];
        const periods = 7;
        const days = ['月', '火', '水', '木', '金'];
        
        function getClassesFromBaseTimetable() {
            const baseTimetable = JSON.parse(localStorage.getItem('baseTimetable') || '{}');
            const collectedClasses = new Set();
            
            Object.values(baseTimetable).forEach(daySchedule => {
                if (!Array.isArray(daySchedule)) return;
                
                daySchedule.forEach(className => {
                    const normalizedClassName = (className || '').trim();
                    if (normalizedClassName) {
                        collectedClasses.add(normalizedClassName);
                    }
                });
            });
            
            return Array.from(collectedClasses).sort((a, b) => a.localeCompare(b, 'ja'));
        }
        
        function getSelectableClasses(additionalClasses = []) {
            const classSet = new Set(classes);
            
            getClassesFromBaseTimetable().forEach(className => {
                classSet.add(className);
            });
            
            additionalClasses.forEach(className => {
                const normalizedClassName = (className || '').trim();
                if (normalizedClassName) {
                    classSet.add(normalizedClassName);
                }
            });
            
            return Array.from(classSet);
        }
        
        function populateClassSelect(selectElement, selectedValue = '') {
            if (!selectElement) return;
            
            const normalizedSelectedValue = (selectedValue || '').trim();
            const selectableClasses = getSelectableClasses(normalizedSelectedValue ? [normalizedSelectedValue] : []);
            selectElement.innerHTML = '';
            
            selectableClasses.forEach(className => {
                const option = document.createElement('option');
                option.value = className;
                option.textContent = className || '—';
                selectElement.appendChild(option);
            });
            
            selectElement.value = normalizedSelectedValue;
        }
        
        // デフォルトの色設定
        const defaultColors = {
            '1-1': '#667eea',
            '1-2': '#f5576c',
            '2-1': '#00f2fe',
            '3-1': '#38f9d7'
        };
        
        // クラス名から自動的に色を生成
        function generateColorForClass(className) {
            const colors = [
                '#667eea', '#f5576c', '#00f2fe', '#38f9d7',
                '#f093fb', '#4facfe', '#43e97b', '#fa709a',
                '#30cfd0', '#a8edea', '#fed6e3', '#c471f5'
            ];
            let hash = 0;
            for (let i = 0; i < className.length; i++) {
                hash = className.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }
        
        // Firebase関連
        let db = null;
        let isFirebaseConfigured = false;
        let isSyncing = false;
        let deviceId = localStorage.getItem('deviceId') || generateDeviceId();
        
        // 現在の表示モード
        let currentView = 'day';
        
        // 現在の表示日付（日別表示用）
        let currentDisplayDate = null;
        
        // 日本時間で今日の日付を取得する関数
        function getTodayJST() {
            const now = new Date();
            // 日本時間（UTC+9）に変換
            const jstOffset = 9 * 60; // 9時間 = 540分
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const jstTime = new Date(utc + (jstOffset * 60000));
            
            const year = jstTime.getFullYear();
            const month = String(jstTime.getMonth() + 1).padStart(2, '0');
            const day = String(jstTime.getDate()).padStart(2, '0');
            
            return `${year}-${month}-${day}`;
        }
        
        // デバイスIDを生成
        function generateDeviceId() {
            const id = 'device_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('deviceId', id);
            return id;
        }
        
        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('アプリ初期化開始...');
            
            // Firebaseを自動初期化
            initializeFirebase(firebaseConfig);
            
            // UI初期化
            initBaseTimetable();
            initChangeTimetable();
            loadColors();
            
            // 今日の日付をデフォルトで設定（日本時間）
            const today = getTodayJST();
            console.log('今日の日付（JST）:', today);
            
            currentDisplayDate = today;
            document.getElementById('changeDate').value = today;
            document.getElementById('weekStartDate').value = getMonday(today);
            
            // 初回表示
            displayDaySchedule();
        });
        
        // 月曜日を取得
        function getMonday(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const dayOfWeek = date.getDay();
            const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            date.setDate(date.getDate() + diff);
            
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }
        
        // 前日へ
        function previousDay() {
            const [year, month, day] = currentDisplayDate.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            date.setDate(date.getDate() - 1);
            currentDisplayDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            displayDaySchedule();
        }
        
        // 翌日へ
        function nextDay() {
            const [year, month, day] = currentDisplayDate.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            date.setDate(date.getDate() + 1);
            currentDisplayDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            displayDaySchedule();
        }
        
        // Firebaseを初期化
        function initializeFirebase(config) {
            console.log('Firebase初期化開始...');
            
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(config);
                    console.log('Firebase初期化成功');
                }
                
                db = firebase.firestore();
                console.log('Firestore接続成功');
                
                isFirebaseConfigured = true;
                
                // オフライン対応を有効化
                db.enablePersistence()
                    .then(() => {
                        console.log('オフライン対応有効化成功');
                    })
                    .catch((err) => {
                        console.warn('Persistence有効化エラー:', err);
                    });
                
                updateSyncStatus('online', '同期中');
                
                // データをFirebaseから読み込み
                syncFromFirebase();
                
                // リアルタイム同期を設定
                setupRealtimeSync();
                
            } catch (error) {
                console.error('Firebase初期化エラー:', error);
                updateSyncStatus('offline', 'Firebase接続エラー: ' + error.message);
                isFirebaseConfigured = false;
            }
        }
        
        // 同期ステータスを更新
        function updateSyncStatus(status, message) {
            const indicator = document.getElementById('syncIndicator');
            const statusText = document.getElementById('syncStatus');
            
            if (indicator && statusText) {
                if (status === 'online') {
                    indicator.classList.remove('offline');
                } else {
                    indicator.classList.add('offline');
                }
                
                statusText.textContent = message;
            }
        }
        
        // Firebaseから同期
        async function syncFromFirebase() {
            if (!isFirebaseConfigured || isSyncing) return;
            
            isSyncing = true;
            console.log('Firebase同期開始...');
            
            try {
                // 基本時間割を取得
                const baseDoc = await db.collection('timetables').doc('base').get();
                if (baseDoc.exists) {
                    const data = baseDoc.data();
                    localStorage.setItem('baseTimetable', JSON.stringify(data.schedule || {}));
                    console.log('基本時間割を同期しました');
                }
                
                // 授業変更を取得
                const changesDoc = await db.collection('timetables').doc('changes').get();
                if (changesDoc.exists) {
                    const data = changesDoc.data();
                    localStorage.setItem('timetableChanges', JSON.stringify(data.changes || {}));
                    console.log('授業変更を同期しました');
                }
                
                // メモを取得
                const memosDoc = await db.collection('timetables').doc('memos').get();
                if (memosDoc.exists) {
                    const data = memosDoc.data();
                    localStorage.setItem('classMemos', JSON.stringify(data.memos || {}));
                    console.log('メモを同期しました');
                }
                
                // 色設定を取得
                const colorsDoc = await db.collection('timetables').doc('colors').get();
                if (colorsDoc.exists) {
                    const data = colorsDoc.data();
                    localStorage.setItem('classColors', JSON.stringify(data.colors || defaultColors));
                    console.log('色設定を同期しました');
                }
                
                updateSyncStatus('online', '同期完了');
                
                // 表示を更新
                if (currentView === 'day') {
                    displayDaySchedule();
                } else if (currentView === 'week') {
                    displayWeekSchedule();
                }
                
            } catch (error) {
                console.error('同期エラー:', error);
                updateSyncStatus('offline', '同期エラー: ' + error.message);
            } finally {
                isSyncing = false;
            }
        }
        
        // リアルタイム同期を設定
        let lastSyncTime = Date.now();
        let isFirstSync = true;
        
        function setupRealtimeSync() {
            if (!isFirebaseConfigured) return;
            
            console.log('リアルタイム同期を設定中...');
            
            // 基本時間割の変更を監視
            db.collection('timetables').doc('base').onSnapshot((doc) => {
                if (isFirstSync) {
                    console.log('初回データ読み込み（リロードなし）');
                    return;
                }
                
                if (doc.exists) {
                    const data = doc.data();
                    const now = Date.now();
                    
                    if (data.lastModifiedBy !== deviceId && (now - lastSyncTime) > 3000) {
                        console.log('基本時間割が他のデバイスで更新されました');
                        localStorage.setItem('baseTimetable', JSON.stringify(data.schedule || {}));
                        lastSyncTime = now;
                        
                        if (currentView === 'day' || currentView === 'week' || currentView === 'base') {
                            updateDisplay();
                        }
                    }
                }
            });
            
            // 授業変更の変更を監視
            db.collection('timetables').doc('changes').onSnapshot((doc) => {
                if (isFirstSync) {
                    return;
                }
                
                if (doc.exists) {
                    const data = doc.data();
                    const now = Date.now();
                    
                    if (data.lastModifiedBy !== deviceId && (now - lastSyncTime) > 3000) {
                        console.log('授業変更が他のデバイスで更新されました');
                        localStorage.setItem('timetableChanges', JSON.stringify(data.changes || {}));
                        lastSyncTime = now;
                        
                        if (currentView === 'day' || currentView === 'week' || currentView === 'change') {
                            updateDisplay();
                        }
                    }
                }
            });
            
            // メモの変更を監視
            db.collection('timetables').doc('memos').onSnapshot((doc) => {
                if (isFirstSync) {
                    return;
                }
                
                if (doc.exists) {
                    const data = doc.data();
                    const now = Date.now();
                    
                    if (data.lastModifiedBy !== deviceId && (now - lastSyncTime) > 3000) {
                        console.log('メモが他のデバイスで更新されました');
                        localStorage.setItem('classMemos', JSON.stringify(data.memos || {}));
                        lastSyncTime = now;
                        
                        if (currentView === 'day') {
                            updateDisplay();
                        }
                    }
                }
            });
            
            // 色設定の変更を監視
            db.collection('timetables').doc('colors').onSnapshot((doc) => {
                if (isFirstSync) {
                    isFirstSync = false;
                    return;
                }
                
                if (doc.exists) {
                    const data = doc.data();
                    const now = Date.now();
                    
                    if (data.lastModifiedBy !== deviceId && (now - lastSyncTime) > 3000) {
                        console.log('色設定が他のデバイスで更新されました');
                        localStorage.setItem('classColors', JSON.stringify(data.colors || defaultColors));
                        lastSyncTime = now;
                        
                        if (currentView === 'day' || currentView === 'week' || currentView === 'colors') {
                            updateDisplay();
                        }
                    }
                }
            });
        }
        
        // 表示を更新（リロードなし）
        function updateDisplay() {
            if (currentView === 'day') {
                displayDaySchedule();
            } else if (currentView === 'week') {
                displayWeekSchedule();
            } else if (currentView === 'base') {
                initBaseTimetable();
            } else if (currentView === 'change') {
                loadDateTimetable();
            } else if (currentView === 'colors') {
                loadColors();
            }
        }
        
        // Firebaseに保存
        async function saveToFirebase(docName, dataObj) {
            if (!isFirebaseConfigured) {
                console.warn('Firebaseが設定されていません');
                return false;
            }
            
            try {
                await db.collection('timetables').doc(docName).set({
                    ...dataObj,
                    lastModified: firebase.firestore.FieldValue.serverTimestamp(),
                    lastModifiedBy: deviceId
                });
                console.log(`${docName}をFirebaseに保存しました`);
                updateSyncStatus('online', '保存完了');
                return true;
            } catch (error) {
                console.error('Firebase保存エラー:', error);
                updateSyncStatus('offline', '保存エラー: ' + error.message);
                return false;
            }
        }

        // 基本時間割の保存
        async function saveBaseTimetable() {

            days.forEach(day => {

        // 授業変更の初期化
        function initChangeTimetable() {
            const tbody = document.getElementById('changeTimetableBody');
            tbody.innerHTML = '';
            
            for (let i = 0; i < periods; i++) {

        // 指定日の時間割を取得
        function getTimetableForDate(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const dayOfWeek = date.getDay();
            
            if (dayOfWeek === 0 || dayOfWeek === 6) {
                return Array(periods).fill('');
            }
            
            const dayIndex = dayOfWeek - 1;
            const dayName = days[dayIndex];
            
            const baseTimetable = JSON.parse(localStorage.getItem('baseTimetable') || '{}');
            const changes = JSON.parse(localStorage.getItem('timetableChanges') || '{}');
            
            const schedule = Array(periods).fill('');
            
            if (baseTimetable[dayName] && Array.isArray(baseTimetable[dayName])) {
                baseTimetable[dayName].forEach((cls, index) => {
                    if (index < periods) {
                        schedule[index] = cls || '';
                    }
                });
            }
            
            if (changes[dateStr] && Array.isArray(changes[dateStr])) {
                changes[dateStr].forEach((change, index) => {
                    if (change !== null && change !== undefined && index < periods) {
                        schedule[index] = change;
                    }
                });
            }
            
            return schedule;
        }
        
        // 指定日の時間割を読み込み
        function loadDateTimetable() {
            const dateInput = document.getElementById('changeDate');
            const selectedDate = dateInput.value;
            
            if (!selectedDate) {
                alert('日付を選択してください');
                return;
            }
            
            const dateInfo = document.getElementById('selectedDateInfo');
            const dateText = document.getElementById('selectedDateText');
            const [year, month, day] = selectedDate.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
            dateText.textContent = `${selectedDate} (${dayOfWeek})`;
            dateInfo.style.display = 'block';
            
            const schedule = getTimetableForDate(selectedDate);
            const changes = JSON.parse(localStorage.getItem('timetableChanges') || '{}');
            const dateChanges = changes[selectedDate] || {};
            
            for (let i = 1; i <= periods; i++) {
                const select = document.getElementById(`change_${i}`);
                const checkbox = document.getElementById(`changed_${i}`);
                const selectedClass = dateChanges[i - 1] ?? schedule[i - 1] ?? '';
                
                if (select) {
                    populateClassSelect(select, selectedClass);
                }
                
                if (checkbox) {
                    checkbox.checked = dateChanges[i - 1] !== null && dateChanges[i - 1] !== undefined;
                }
            }
        }
        
        // 授業変更を保存
        async function saveChangeTimetable() {
            const dateInput = document.getElementById('changeDate');
            const selectedDate = dateInput.value;
            
            if (!selectedDate) {
                alert('日付を選択してください');
                return;
            }
            
            const changes = JSON.parse(localStorage.getItem('timetableChanges') || '{}');
            
            if (!changes[selectedDate]) {
                changes[selectedDate] = Array(periods).fill(null);
            }
            
            for (let i = 1; i <= periods; i++) {
                const checkbox = document.getElementById(`changed_${i}`);
                const select = document.getElementById(`change_${i}`);
                
                if (checkbox && checkbox.checked && select) {
                    changes[selectedDate][i - 1] = select.value;
                } else {
                    changes[selectedDate][i - 1] = null;
                }
            }
            
            if (changes[selectedDate].every(item => item === null)) {
                delete changes[selectedDate];
            }
            
            localStorage.setItem('timetableChanges', JSON.stringify(changes));
            await saveToFirebase('changes', { changes: changes });
            showMessage('changeMessage');
        }
        
        // すべての変更をクリア
        async function clearAllChanges() {
            if (confirm('この日の授業変更をすべてクリアしますか？')) {
                const dateInput = document.getElementById('changeDate');
                const selectedDate = dateInput.value;
                
                if (selectedDate) {
                    const changes = JSON.parse(localStorage.getItem('timetableChanges') || '{}');
                    delete changes[selectedDate];
                    localStorage.setItem('timetableChanges', JSON.stringify(changes));
                    await saveToFirebase('changes', { changes: changes });
                    loadDateTimetable();
                    showMessage('changeMessage');
                }
            }
        }

                saveBtn.textContent = '保存';
                saveBtn.style.display = dateChanges[i] !== null && dateChanges[i] !== undefined ? 'inline-block' : 'none';
                saveBtn.onclick = () => saveDayChange(selectedDate, i);
                
                memoControls.appendChild(changeSelect);
                memoControls.appendChild(changeBtn);
                memoControls.appendChild(saveBtn);
                rightSection.appendChild(memoControls);
                
                item.appendChild(leftSection);
                item.appendChild(rightSection);
                
                display.appendChild(item);
            }
        }
        
        // 日別表示での授業変更トグル
        function toggleDayChange(dateStr, periodIndex) {
            const changes = JSON.parse(localStorage.getItem('timetableChanges') || '{}');
            
            if (!changes[dateStr]) {
                changes[dateStr] = Array(periods).fill(null);
            }
            
            if (changes[dateStr][periodIndex] !== null && changes[dateStr][periodIndex] !== undefined) {
                // 元に戻す
                changes[dateStr][periodIndex] = null;
                if (changes[dateStr].every(item => item === null)) {
                    delete changes[dateStr];
                }
            } else {
                // 変更モードにする
                const schedule = getTimetableForDate(dateStr);
                changes[dateStr][periodIndex] = schedule[periodIndex] || '';
            }
            
            localStorage.setItem('timetableChanges', JSON.stringify(changes));
            displayDaySchedule();
        }
        
        // 日別表示での授業変更保存
        async function saveDayChange(dateStr, periodIndex) {
            const select = document.getElementById(`day_change_${periodIndex}`);
            if (!select) return;
            
            const changes = JSON.parse(localStorage.getItem('timetableChanges') || '{}');
            
            if (!changes[dateStr]) {
                changes[dateStr] = Array(periods).fill(null);
            }
            
            changes[dateStr][periodIndex] = select.value;
            
            localStorage.setItem('timetableChanges', JSON.stringify(changes));
            await saveToFirebase('changes', { changes: changes });
            
            alert('保存しました！');
            displayDaySchedule();
        }
        
        // メモを保存
        async function saveMemo(dateStr, periodIndex) {
            const memoInput = document.getElementById(`memo_${periodIndex}`);
            if (!memoInput) return;
            
            const memos = JSON.parse(localStorage.getItem('classMemos') || '{}');
            const memoKey = `${dateStr}_${periodIndex}`;
            
            if (memoInput.value.trim() === '') {
                delete memos[memoKey];
            } else {

            await saveToFirebase('memos', { memos: memos });

        // 前週を表示
        function showPreviousWeek() {
            const dateInput = document.getElementById('weekStartDate');
            let currentDate = dateInput.value;
            
            if (!currentDate) {
                // 日付が未設定の場合は今日から前週を計算
                const today = getTodayJST();
                const [year, month, day] = today.split('-').map(Number);
                const date = new Date(year, month - 1, day);
                date.setDate(date.getDate() - 7);
                currentDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            } else {
                // 現在の日付から7日前
                const [year, month, day] = currentDate.split('-').map(Number);
                const date = new Date(year, month - 1, day);
                date.setDate(date.getDate() - 7);
                currentDate = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            }
            
            dateInput.value = currentDate;
            displayWeekSchedule();
        }

        // 週間予定を表示
        function displayWeekSchedule() {
            const dateInput = document.getElementById('weekStartDate');
            let startDate = dateInput.value;
            
            if (!startDate) {
                alert('週の開始日を選択してください');
                return;
            }
            
            const [year, month, day] = startDate.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const dayOfWeek = date.getDay();
            const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            date.setDate(date.getDate() + diff);
            
            const mondayYear = date.getFullYear();
            const mondayMonth = String(date.getMonth() + 1).padStart(2, '0');
            const mondayDay = String(date.getDate()).padStart(2, '0');
            startDate = `${mondayYear}-${mondayMonth}-${mondayDay}`;
            dateInput.value = startDate;
            
            const endDate = new Date(date.getFullYear(), date.getMonth(), date.getDate() + 4);
            const endDateStr = `${endDate.getFullYear()}-${String(endDate.getMonth() + 1).padStart(2, '0')}-${String(endDate.getDate()).padStart(2, '0')}`;
            const title = document.getElementById('weekDisplayTitle');
            title.textContent = `${startDate} 〜 ${endDateStr}`;
            
            const table = document.getElementById('weekScheduleTable');
            table.innerHTML = '';
            
            const colors = JSON.parse(localStorage.getItem('classColors') || JSON.stringify(defaultColors));
            
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            headerRow.innerHTML = '<th>時限</th>';
            
            for (let i = 0; i < 5; i++) {
                const currentDate = new Date(date.getFullYear(), date.getMonth(), date.getDate() + i);
                const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;
                const dayName = days[i];
                headerRow.innerHTML += `<th>${dayName}<br><span class="week-header">${dateStr}</span></th>`;
            }
            thead.appendChild(headerRow);
            table.appendChild(thead);
            
            const tbody = document.createElement('tbody');
            for (let period = 0; period < periods; period++) {
                const row = tbody.insertRow();
                const periodCell = row.insertCell(0);
                periodCell.textContent = `${period + 1}限`;
                periodCell.className = 'period-cell';
                
                for (let day = 0; day < 5; day++) {
                    const currentDate = new Date(date.getFullYear(), date.getMonth(), date.getDate() + day);
                    const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(currentDate.getDate()).padStart(2, '0')}`;
                    const schedule = getTimetableForDate(dateStr);
                    const cls = schedule[period] || '';
                    
                    const cell = row.insertCell(day + 1);
                    
                    if (cls) {
                        const badge = document.createElement('div');
                        badge.className = 'class-badge';
                        badge.textContent = cls;
                        const color = colors[cls] || defaultColors[cls] || generateColorForClass(cls);
                        badge.style.background = color;
                        badge.style.fontSize = '12px';
                        badge.style.padding = '6px 10px';
                        cell.appendChild(badge);
                    } else {
                        cell.textContent = '—';
                        cell.style.color = '#adb5bd';
                    }
                }
            }
            table.appendChild(tbody);
        }
        
        // 色設定の読み込み
        function loadColors() {
            const container = document.getElementById('colorSettings');
            container.innerHTML = '';
            
            const colors = JSON.parse(localStorage.getItem('classColors') || JSON.stringify(defaultColors));
            const allClasses = new Set(getClassesFromBaseTimetable());
            
            // クラスが一つもない場合はメッセージを表示
            if (allClasses.size === 0) {
                const message = document.createElement('p');
                message.style.color = '#6c757d';
                message.style.textAlign = 'center';
                message.style.padding = '20px';
                message.textContent = '基本時間割を設定すると、ここにクラス別の色設定が表示されます。';
                container.appendChild(message);
                return;
            }
            
            // クラスごとに色設定を表示
            Array.from(allClasses).sort().forEach(className => {
                const item = document.createElement('div');
                item.className = 'color-item';
                
                const label = document.createElement('label');
                label.textContent = `クラス ${className}`;
                
                const input = document.createElement('input');
                input.type = 'color';
                input.value = colors[className] || defaultColors[className] || generateColorForClass(className);
                input.id = `color_${className.replace(/[^a-zA-Z0-9]/g, '_')}`;
                input.dataset.className = className;
                
                item.appendChild(label);
                item.appendChild(input);
                container.appendChild(item);
            });
        }
        
        // 色設定の保存
        async function saveColors() {
            const newColors = {};
            
            const container = document.getElementById('colorSettings');
            const inputs = container.querySelectorAll('input[type="color"]');
            
            inputs.forEach(input => {
                const className = input.dataset.className;
                if (className) {
                    newColors[className] = input.value;
                }
            });
            
            localStorage.setItem('classColors', JSON.stringify(newColors));
            await saveToFirebase('colors', { colors: newColors });
            showMessage('colorMessage');
            
            // 表示を更新
            if (currentView === 'day') {
                displayDaySchedule();
            } else if (currentView === 'week') {
                displayWeekSchedule();
            }
        }
        
        // メッセージ表示
        function showMessage(messageId) {
            const message = document.getElementById(messageId);
            message.classList.add('show');
            setTimeout(() => {
                message.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
